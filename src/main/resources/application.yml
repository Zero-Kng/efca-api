server:
  port: ${PORT:8080}
  tomcat:
    max-swallow-size: 64KB
    max-http-form-post-size: 64KB

spring:
  application:
    name: efca-api
  jackson:
    deserialization:
      fail-on-unknown-properties: true

efca:
  cors:
    allowed-origins: ${EFCA_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

management:
  endpoints:
    web:
      exposure:
        include: health
